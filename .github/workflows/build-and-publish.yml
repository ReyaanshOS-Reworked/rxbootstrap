name: Build ReyaanshOS

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "ReyaanshOS version (e.g. 26.12)"
        required: true
        type: string

      release_tag:
        description: "Git release tag (leave blank to use vVERSION)"
        required: false
        type: string

      release_notes:
        description: "Release notes"
        required: false
        type: string

      arch:
        description: "Target architecture"
        required: true
        type: choice
        options:
          - amd64
          - arm64
        default: amd64

      de:
        description: "Desktop environment"
        required: true
        type: choice
        options:
          - none
          - plasma-mobile
          - plasma-desktop
        default: none

      hostname:
        description: "Default system hostname"
        required: true
        type: string
        default: reyaanshos

      add:
        description: "Additional packages (space-separated)"
        required: false
        type: string

      create_image:
        description: "Create bootable disk image"
        required: true
        type: boolean
        default: true

      img_size:
        description: "Disk image size"
        required: true
        type: string
        default: 8G

      force:
        description: "Force rebuild"
        required: true
        type: boolean
        default: false

      keep_tmp:
        description: "Keep temporary build files"
        required: true
        type: boolean
        default: false

      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ReyaanshOS (${{ inputs.arch }})
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}

    steps:
      - name: Checkout RXBootstrap
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            parted \
            dosfstools \
            e2fsprogs \
            rsync \
            util-linux \
            coreutils

      - name: Validate release information
        env:
          VERSION: ${{ inputs.release_version }}
          TAG: ${{ inputs.release_tag }}
          IMAGE_SIZE: ${{ inputs.img_size }}
          HOSTNAME: ${{ inputs.hostname }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]]; then
            echo "Invalid ReyaanshOS version: $VERSION"
            exit 1
          fi

          if [[ -z "$TAG" ]]; then
            TAG="v${VERSION}"
          fi

          git check-ref-format "refs/tags/$TAG"

          if [[ ! "$IMAGE_SIZE" =~ ^[0-9]+[KMGTP]?$ ]]; then
            echo "Invalid image size: $IMAGE_SIZE"
            exit 1
          fi

          if [[ ! "$HOSTNAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]; then
            echo "Invalid hostname"
            exit 1
          fi

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build rootfs / disk image
        env:
          ARCH: ${{ inputs.arch }}
          DE: ${{ inputs.de }}
          HOSTNAME: ${{ inputs.hostname }}
          ADD_PACKAGES: ${{ inputs.add }}
          CREATE_IMAGE: ${{ inputs.create_image }}
          IMAGE_SIZE: ${{ inputs.img_size }}
          FORCE: ${{ inputs.force }}
          KEEP_TMP: ${{ inputs.keep_tmp }}
          ROOT_PASSWORD: ${{ secrets.RXBOOTSTRAP_ROOT_PASSWORD }}
        run: |
          set -euo pipefail

          args=(
            --arch "$ARCH"
            --DE "$DE"
            --hostname "$HOSTNAME"
          )

          if [[ -n "$ADD_PACKAGES" ]]; then
            args+=(--add "$ADD_PACKAGES")
          fi

          if [[ "$CREATE_IMAGE" == "true" ]]; then
            args+=(--create-image --img-size "$IMAGE_SIZE")
          fi

          if [[ "$FORCE" == "true" ]]; then
            args+=(--force)
          fi

          if [[ "$KEEP_TMP" == "true" ]]; then
            args+=(--keep-tmp)
          fi

          if [[ -n "$ROOT_PASSWORD" ]]; then
            args+=(--root-password "$ROOT_PASSWORD")
          fi

          sudo python3 rxbootstrap.py "${args[@]}"

      - name: Check build output
        run: |
          set -euo pipefail

          if [[ ! -d out ]] || [[ -z "$(find out -maxdepth 1 -type f -print -quit)" ]]; then
            echo "No build files found in out/"
            exit 1
          fi

          echo "Build output:"
          ls -lh out/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReyaanshOS-${{ inputs.release_version }}-${{ inputs.arch }}
          path: out/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ReyaanshOS ${{ inputs.release_version }}
          body: |
            # ReyaanshOS ${{ inputs.release_version }}

            **Architecture:** ${{ inputs.arch }}
            **Desktop Environment:** ${{ inputs.de }}
            **Hostname:** ${{ inputs.hostname }}

            ${{ inputs.release_notes }}

            ---
            Built automatically using RXBootstrap.
          target_commitish: ${{ github.sha }}
          files: out/*
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
