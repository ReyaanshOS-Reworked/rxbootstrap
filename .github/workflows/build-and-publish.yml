name: RXBootstrap - ReyaanshOS Builder

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        type: choice
        required: true
        default: amd64
        options:
          - amd64
          - arm64

      de:
        description: "Desktop environment"
        type: choice
        required: true
        default: none
        options:
          - none
          - plasma-mobile
          - plasma-desktop

      hostname:
        description: "System hostname"
        type: string
        required: true
        default: reyaanshos

      add:
        description: "Extra packages (comma-separated)"
        type: string
        default: ""

      create_image:
        description: "Create bootable UEFI image"
        type: boolean
        default: true

      img_size:
        description: "Image size (e.g. 8G, 16G)"
        type: string
        default: 8G

      force:
        description: "Force rootfs download and extraction"
        type: boolean
        default: false

      keep_tmp:
        description: "Keep temporary build files"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ReyaanshOS (${{ inputs.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # Checkout repository
      - name: Checkout RXBootstrap
        uses: actions/checkout@v4

      # Install host dependencies
      - name: Install dependencies
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            python3 \
            parted \
            dosfstools \
            e2fsprogs \
            rsync \
            util-linux \
            coreutils

          # ARM64 cross-architecture support
          if [[ "$ARCH" == "arm64" ]]; then
            sudo apt-get install -y \
              qemu-user-static \
              binfmt-support

            sudo update-binfmts --enable qemu-aarch64 || true
          fi

      # Validate inputs
      - name: Validate configuration
        env:
          HOSTNAME: ${{ inputs.hostname }}
          IMG_SIZE: ${{ inputs.img_size }}
          ADD: ${{ inputs.add }}
        run: |
          set -e

          if [[ ! "$HOSTNAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]{0,62}$ ]]; then
            echo "Invalid hostname"
            exit 1
          fi

          if [[ ! "$IMG_SIZE" =~ ^[0-9]+[KMGTP]?$ ]]; then
            echo "Invalid image size"
            exit 1
          fi

          if [[ "$ADD" =~ [^a-zA-Z0-9_+.,:-] ]]; then
            echo "Invalid package list"
            exit 1
          fi

      # Run RXBootstrap
      - name: Build ReyaanshOS
        env:
          ARCH: ${{ inputs.arch }}
          DE: ${{ inputs.de }}
          HOSTNAME: ${{ inputs.hostname }}
          ADD: ${{ inputs.add }}
          CREATE_IMAGE: ${{ inputs.create_image }}
          IMG_SIZE: ${{ inputs.img_size }}
          FORCE: ${{ inputs.force }}
          KEEP_TMP: ${{ inputs.keep_tmp }}
          ROOT_PASSWORD: ${{ secrets.RXBOOTSTRAP_ROOT_PASSWORD }}
        run: |
          set -euo pipefail

          args=(
            --arch "$ARCH"
            --DE "$DE"
            --hostname "$HOSTNAME"
          )

          if [[ -n "$ADD" ]]; then
            args+=(--add "$ADD")
          fi

          if [[ "$CREATE_IMAGE" == "true" ]]; then
            args+=(--create-image --img-size "$IMG_SIZE")
          fi

          if [[ "$FORCE" == "true" ]]; then
            args+=(--force)
          fi

          if [[ "$KEEP_TMP" == "true" ]]; then
            args+=(--keep-tmp)
          fi

          if [[ -n "$ROOT_PASSWORD" ]]; then
            args+=(--root-password "$ROOT_PASSWORD")
          fi

          echo "=================================="
          echo " ReyaanshOS Build Configuration"
          echo "=================================="
          echo "Architecture : $ARCH"
          echo "Desktop      : $DE"
          echo "Hostname     : $HOSTNAME"
          echo "Image        : $CREATE_IMAGE"
          echo "Image size   : $IMG_SIZE"
          echo "=================================="

          sudo python3 rxbootstrap.py "${args[@]}"

      # Show generated files
      - name: List build outputs
        run: |
          echo "Generated files:"
          find out -type f -printf '%p (%s bytes)\n'

      # Upload artifacts
      - name: Upload ReyaanshOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReyaanshOS-${{ inputs.arch }}-${{ inputs.de }}-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
